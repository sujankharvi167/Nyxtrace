services:
  - type: web
    name: nyxtrace-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: APP_ENV
        value: production
      - key: DEBUG
        value: false
      - key: ALLOWED_ORIGINS
        sync: false
      - key: RISK_ASSESSMENT_VERSION
        value: nyxtrace-risk-v1
    disk:
      name: nyxtrace-data
      mountPath: /opt/render/project/src/backend/data
      sizeGB: 10
